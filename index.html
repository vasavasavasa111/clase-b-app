<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licencia Clase B</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#dfe4ea;
  --accent:#2563eb; --accent-ink:#ffffff;
  --ok:#15803d; --ok-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --miss:#b45309; --miss-bg:#fff4e0;
  --ru:#6b4fbb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --card:#1a2028; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
    --accent:#5b8def; --accent-ink:#0b1220;
    --ok:#4ade80; --ok-bg:#12301d; --bad:#f87171; --bad-bg:#3a1717; --miss:#fbbf24; --miss-bg:#382a0e;
    --ru:#b9a5f5;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --card:#1a2028; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
  --accent:#5b8def; --accent-ink:#0b1220;
  --ok:#4ade80; --ok-bg:#12301d; --bad:#f87171; --bad-bg:#3a1717; --miss:#fbbf24; --miss-bg:#382a0e;
  --ru:#b9a5f5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 80px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.base{flex:0 0 auto;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:118px;font-variant-numeric:tabular-nums}
.base b{font-size:18px}
.base .bar{margin:4px 0 2px;height:5px}
.base .lbl{font-size:11px;color:var(--muted)}
h1{font-size:19px;margin:0}
.stat{color:var(--muted);font-size:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px;gap:8px}
.q-es{font-weight:600;font-size:17px}
.ru{color:var(--ru);font-size:15px;margin-top:4px}
.hide-ru .ru,.hide-ru .opt .ru{display:none}
.hide-ru .ru.peek,.hide-ru .opt .ru.peek{display:block}
.img{display:block;max-width:100%;max-height:300px;margin:12px auto;border-radius:8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:1.4em}
.opt .ru{display:block}
.opt.sel{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.miss{border-color:var(--miss);background:var(--miss-bg)}
.opt .tag{margin-left:auto;font-size:12px;font-weight:700;align-self:center;white-space:nowrap}
.opt.ok .tag{color:var(--ok)} .opt.bad .tag{color:var(--bad)} .opt.miss .tag{color:var(--miss)}
.badge{display:inline-block;font-size:12px;border-radius:6px;padding:1px 6px;background:var(--miss-bg);color:var(--miss);margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.spacer{flex:1}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.big{font-size:28px;font-weight:700}
.muted{color:var(--muted)}
input[type=search]{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
select#chSel{font:inherit;font-size:14px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.drop{border:2px dashed var(--line);text-align:center}
body.dragging .drop,body.dragging #view{outline:3px dashed var(--accent);outline-offset:4px}
.paste{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--muted);margin-top:10px;background:var(--bg)}
.filebtn{display:inline-block;cursor:pointer;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 12px}
.shot{display:block;max-width:100%;max-height:260px;margin:0 auto 8px;border-radius:8px}
textarea.ocr{font:13px/1.4 ui-monospace,monospace;width:100%;min-height:110px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hit{font-weight:700;margin:4px 0 10px}
.hit.good{color:var(--ok)} .hit.maybe{color:var(--miss)} .hit.none{color:var(--bad)}
input.key{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:8px 0}
</style>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>Licencia Clase B · ES/RU</h1>
      <div class="stat" id="stat"></div>
    </div>
    <div class="base" title="Уникальных вопросов в программе из ~1500 в базе practicatest">
      <div><b id="baseN"></b> / <span id="baseT"></span></div>
      <div class="bar"><i id="baseBar"></i></div>
      <div class="lbl">вопросов в базе</div>
    </div>
  </header>
  <nav>
    <button class="tab" data-mode="train">Тренировка</button>
    <button class="tab" data-mode="mistakes">Ошибки</button>
    <button class="tab" data-mode="exam">Экзамен 35</button>
    <button class="tab" data-mode="list">Все вопросы</button>
    <button class="tab" data-mode="photo">По фото</button>
    <span class="spacer"></span>
    <select id="chSel" aria-label="Глава"></select>
    <label class="chk"><input type="checkbox" id="ruToggle" checked> русский</label>
  </nav>
  <main id="view"></main>
</div>
<script>
function startApp(ALL, IMG, CH){
CH = CH || {};
let Q = ALL;            // questions of the chosen chapter (all by default)
const TOTAL = 1500;   // questions practicatest says it has for Clase B

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// progress: id -> {right, wrong, last: true|false}
let P = store.get('cb_progress', {});
const save = () => store.set('cb_progress', P);

const $ = s => document.querySelector(s);
const view = $('#view');
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function updStat(){
  const learned = Q.filter(q => P[q.id] && P[q.id].last === true).length;
  const wrong = Q.filter(q => P[q.id] && P[q.id].last === false).length;
  $('#stat').textContent = `верно: ${learned}/${Q.length} · ошибки: ${wrong}`;
  $('#baseN').textContent = ALL.length;
  $('#baseT').textContent = TOTAL;
  $('#baseBar').style.width = Math.min(100, ALL.length / TOTAL * 100) + '%';
}

// ---- language toggle
const ruBox = $('#ruToggle');
ruBox.checked = store.get('cb_ru', true);
const applyRu = () => { document.body.classList.toggle('hide-ru', !ruBox.checked); store.set('cb_ru', ruBox.checked); };
ruBox.onchange = applyRu; applyRu();

// ---- chapter filter
const chSel = $('#chSel');
const count = c => ALL.filter(q => String(q.ch) === String(c)).length;
chSel.innerHTML = `<option value="">Все главы (${ALL.length})</option>` +
  Object.keys(CH).sort((a, b) => a - b).map(c => `<option value="${c}">${c}. ${esc(CH[c])} (${count(c)})</option>`).join('') +
  (ALL.some(q => !q.ch) ? `<option value="none">Без главы — экзамены (${ALL.filter(q => !q.ch).length})</option>` : '');
const applyCh = () => {
  const v = chSel.value;
  Q = !v ? ALL : v === 'none' ? ALL.filter(q => !q.ch) : ALL.filter(q => String(q.ch) === v);
  store.set('cb_ch', v); updStat();
};
chSel.value = store.get('cb_ch', '');
if (chSel.selectedIndex < 0) chSel.value = '';
applyCh();
chSel.onchange = () => { applyCh(); const t = document.querySelector('nav .tab[aria-pressed="true"]'); if (t) t.click(); };
view.addEventListener('click', e => { const r = e.target.closest('.peekable'); if(r && !ruBox.checked) r.querySelectorAll('.ru').forEach(x=>x.classList.toggle('peek')); });

// ---- question card
function qHead(q, label){
  return `<div class="meta"><span>${label}</span><span>${q.seen_in.join(', ')}</span></div>
    ${q.multi ? '<span class="badge">несколько ответов · varias respuestas</span>' : ''}
    <div class="peekable"><div class="q-es">${esc(q.es)}</div><div class="ru">${esc(q.ru)}</div></div>
    ${q.img && IMG[q.img] ? imgTag(IMG[q.img]) : ''}`;
}
// photos are inline data: URLs in the single-file build; the web app passes file paths
// and a loader (window.loadImg) that fetches and decrypts a photo once it is on screen
function imgTag(src){
  return src.startsWith('data:') ? `<img class="img" alt="" src="${src}">` : `<img class="img" alt="" data-img="${src}">`;
}
if (window.loadImg) {
  const seen = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    seen.unobserve(e.target);
    window.loadImg(e.target.dataset.img).then(u => { e.target.src = u; }).catch(() => {});
  }), {rootMargin: '400px'});
  new MutationObserver(() => view.querySelectorAll('img[data-img]:not([data-w])').forEach(im => {
    im.dataset.w = 1; seen.observe(im);
  })).observe(view, {childList: true, subtree: true});
}
function optHTML(o, i, cls, tag){
  return `<button class="opt ${cls}" data-i="${i}"><span class="k">${'ABCD'[i]}</span>
    <span class="peekable"><span>${esc(o.es)}</span><span class="ru">${esc(o.ru)}</span></span>
    ${tag ? `<span class="tag">${tag}</span>` : ''}</button>`;
}
// fix: .ru inside options must respect hide-ru

// Ask one question; resolves with true/false after the user answers.
function ask(q, label, {reveal = true, onDone}){
  const order = shuffle(q.opts.map((_, i) => i));
  const opts = order.map(i => q.opts[i]);
  let picked = new Set(), done = false;
  const render = () => {
    view.innerHTML = `<div class="card">${qHead(q, label)}<div class="opts">${
      opts.map((o, i) => {
        if(!done) return optHTML(o, i, picked.has(i) ? 'sel' : '', '');
        if(!reveal) return optHTML(o, i, picked.has(i) ? 'sel' : '', '');
        if(o.ok && picked.has(i)) return optHTML(o, i, 'ok', '✓ верно');
        if(o.ok) return optHTML(o, i, 'miss', '✓ правильный');
        if(picked.has(i)) return optHTML(o, i, 'bad', '✗');
        return optHTML(o, i, '', '');
      }).join('')}</div>
      <div class="row">${!done && q.multi ? '<button class="primary" id="check">Проверить</button>' : ''}
        <span class="spacer"></span>${done ? '<button class="primary" id="next">Дальше →</button>' : ''}</div></div>`;
    view.querySelectorAll('.opt').forEach(b => b.onclick = e => {
      if(done) return;
      const i = +b.dataset.i;
      if(q.multi){ picked.has(i) ? picked.delete(i) : picked.add(i); render(); }
      else { picked = new Set([i]); finish(); }
    });
    const c = $('#check'); if(c) c.onclick = () => picked.size && finish();
    const n = $('#next'); if(n){ n.onclick = next; n.focus({preventScroll: true}); }
  };
  let result;
  let moved = false;
  const next = () => { if(moved) return; moved = true; onDone(result); window.scrollTo(0, 0); };
  const finish = () => {
    done = true;
    result = opts.every((o, i) => o.ok === picked.has(i));
    render();
    if(!reveal) return next();
    if(result) setTimeout(next, 500);   // right answer: flash green, then move on by itself
  };
  render();
}

function record(q, ok){
  const p = P[q.id] || {right:0, wrong:0};
  ok ? p.right++ : p.wrong++; p.last = ok; P[q.id] = p; save(); updStat();
}

// ---- modes
function train(pool, title){
  if(!pool.length){ view.innerHTML = `<div class="card">Здесь пусто — ошибок нет. 🎉</div>`; return; }
  // unseen first, then wrong, then the rest
  const w = q => !P[q.id] ? 0 : P[q.id].last === false ? 1 : 2;
  const deck = shuffle(pool).sort((a, b) => w(a) - w(b));
  let i = 0, right = 0;
  const step = () => {
    if(i >= deck.length){ view.innerHTML = `<div class="card"><div class="big">${right}/${deck.length}</div><p class="muted">Круг пройден.</p><button class="primary" id="again">Ещё круг</button></div>`; $('#again').onclick = () => train(pool, title); return; }
    const q = deck[i];
    ask(q, `${title} · ${i + 1}/${deck.length}`, {onDone: ok => { if(ok) right++; i++; step(); }});
  };
  step();
}
// wrap ask to record progress in train/mistakes
const _ask = ask;
ask = function(q, label, o){ return _ask(q, label, {...o, onDone: ok => { if(!o.noRecord) record(q, ok); o.onDone(ok); }}); };

function exam(){
  const deck = shuffle(Q).slice(0, Math.min(35, Q.length));
  const answers = [];
  const t0 = Date.now(), LIMIT = 45 * 60 * 1000;
  let i = 0;
  const step = () => {
    const left = LIMIT - (Date.now() - t0);
    if(i >= deck.length || left <= 0) return results();
    const mm = Math.max(0, Math.floor(left / 60000));
    ask(deck[i], `Экзамен · ${i + 1}/${deck.length} · осталось ~${mm} мин`, {onDone: ok => { answers.push(ok); i++; step(); }});
  };
  const results = () => {
    const n = answers.filter(Boolean).length;
    const pct = Math.round(n / deck.length * 100);
    view.innerHTML = `<div class="card"><div class="big">${n}/${deck.length} · ${pct}%</div>
      <p class="muted">${pct >= 87 ? 'Хороший результат.' : 'Пока ниже уровня сдачи.'} Порог на реальном экзамене — около 33 из 38 баллов (3 вопроса идут за 2 балла); уточни в муниципалитете.</p>
      <div class="row"><button class="primary" id="again">Новый экзамен</button><button id="rev">Разбор ошибок</button></div></div>`;
    $('#again').onclick = exam;
    $('#rev').onclick = () => train(deck.filter((q, k) => answers[k] === false), 'Разбор');
  };
  step();
}

function list(){
  const draw = (f = '') => {
    const t = f.trim().toLowerCase();
    const items = Q.filter(q => !t || (q.es + ' ' + q.ru + ' ' + q.opts.map(o => o.es + ' ' + o.ru).join(' ')).toLowerCase().includes(t));
    $('#cards').innerHTML = items.map(q => `<div class="card">${qHead(q, P[q.id] ? (P[q.id].last ? '✓ знаю' : '✗ ошибка') : 'новый')}
      <div class="opts">${q.opts.map((o, i) => optHTML(o, i, o.ok ? 'ok' : '', o.ok ? '✓' : '')).join('')}</div></div>`).join('')
      || '<p class="muted">Ничего не найдено.</p>';
  };
  view.innerHTML = `<input type="search" id="find" placeholder="Поиск по-испански или по-русски…"><div id="cards"></div>`;
  $('#find').oninput = e => draw(e.target.value);
  draw();
}

// ---- photo: a screenshot of a question -> the question in the base with its answer;
// a question that is not in the base goes to Claude (with the user's own API key)
// OCR reads roman numerals as 1/l (I, II, III -> 1, 11, Ill): such words are compared as roman numerals
const normT = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim()
  .split(' ').map(w => /^[ivxl1]+$/.test(w) ? w.replace(/[l1]/g, 'i') : w).join(' ');
const tri = s => { const t = ' ' + normT(s) + ' ', r = new Set(); for (let i = 0; i + 3 <= t.length; i++) r.add(t.slice(i, i + 3)); return r; };
// f: share of a question's letter trigrams found in the screenshot text - extra text around it
// (site menus, buttons) does not lower it, and the options tell look-alike questions apart; shown as
// the match %. Ranking also counts how much of the screenshot the question explains, so a short
// question whose words happen to appear inside a long one does not win.
const hits = (a, b) => { let n = 0; a.forEach(x => { if (b.has(x)) n++; }); return n; };
let index = null;
function findMatches(text, n = 5){
  index = index || ALL.map(q => { const tq = tri(q.es), to = tri(q.opts.map(o => o.es).join(' ')); return {q, tq, to, all: new Set([...tq, ...to])}; });
  const t = tri(text);
  return index.map(e => {
    const cq = hits(e.tq, t) / (e.tq.size || 1), co = e.to.size ? hits(e.to, t) / e.to.size : 0, r = hits(e.all, t) / (t.size || 1);
    return {q: e.q, f: 0.6 * cq + 0.4 * co, s: 0.45 * cq + 0.3 * co + 0.25 * r};
  }).sort((a, b) => b.s - a.s).slice(0, n);
}
// histogram-equalized grey copy: brings out text dimmed under a page overlay
function equalized(file){
  return new Promise((ok, no) => { const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height), px = d.data, h = new Array(256).fill(0), y = new Uint8Array(px.length / 4);
    for (let i = 0; i < y.length; i++) { y[i] = (px[4*i] * 77 + px[4*i+1] * 150 + px[4*i+2] * 29) >> 8; h[y[i]]++; }
    const cdf = []; h.reduce((a, v, i) => (cdf[i] = a + v), 0);
    const lo = cdf.find(v => v > 0), map = cdf.map(v => Math.round((v - lo) / Math.max(1, y.length - lo) * 255));
    for (let i = 0; i < y.length; i++) px[4*i] = px[4*i+1] = px[4*i+2] = map[y[i]];
    g.putImageData(d, 0, 0); c.toBlob(ok, 'image/png'); }; im.onerror = no; im.src = URL.createObjectURL(file); });
}
function answerCard(q, label){
  return `<div class="card">${qHead(q, label)}<div class="opts">${q.opts.map((o, i) => optHTML(o, i, o.ok ? 'ok' : '', o.ok ? '✓' : '')).join('')}</div></div>`;
}
function loadScript(src){
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('не загрузился ' + src)); document.head.appendChild(s); });
}
// OCR runs on the device (tesseract.js, Spanish); the web app serves it itself, so it works offline
let ocr = null, ocrProgress = () => {};
function getOcr(){
  if (!ocr) ocr = (async () => {
    const base = window.OCR_BASE ? new URL(window.OCR_BASE, location.href).href : 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/';
    if (!window.Tesseract) await loadScript(base + 'tesseract.min.js');
    const opts = {logger: m => ocrProgress(m)};
    if (window.OCR_BASE) Object.assign(opts, {workerPath: base + 'worker.min.js', corePath: base + 'core', langPath: base + 'lang'});
    return Tesseract.createWorker('spa', 1, opts);
  })().catch(e => { ocr = null; throw e; });
  return ocr;
}
let shot = null;   // {file, url, text}
function openShot(file){
  if (store.get('cb_mode', '') !== 'photo') document.querySelector('nav .tab[data-mode="photo"]').click();
  readShot(file);
}
async function readShot(file){
  if (shot) URL.revokeObjectURL(shot.url);
  shot = {file, url: URL.createObjectURL(file), text: ''};
  const out = $('#shotOut');
  out.innerHTML = `<div class="card"><img class="shot" alt="" src="${shot.url}"><p class="muted" id="ocrMsg">Распознаю текст…</p></div>`;
  ocrProgress = m => { const el = $('#ocrMsg'); if (!el) return;
    el.textContent = m.status === 'recognizing text' ? `Распознаю текст… ${Math.round(m.progress * 100)}%` : 'Загружаю распознавание (первый раз дольше)…'; };
  try {
    const w = await getOcr();
    shot.text = (await w.recognize(file)).data.text;
    // nothing certain: read it once more with stronger contrast and use both readings
    if (!(findMatches(shot.text, 1)[0].f >= 0.72)) {
      ocrProgress = m => { const el = $('#ocrMsg'); if (el && m.status === 'recognizing text') el.textContent = `Ещё раз, с усиленным контрастом… ${Math.round(m.progress * 100)}%`; };
      shot.text += '\n' + (await w.recognize(await equalized(file))).data.text;
    }
  }
  catch (e) { shot.text = ''; out.innerHTML = `<div class="card">Не удалось распознать текст: ${esc(String(e.message || e))}. Можно спросить ИИ — он прочтёт картинку сам.</div>`; }
  showShot();
}
function showShot(){
  const m = findMatches(shot.text), best = m.length ? m[0].f : 0, pct = s => Math.round(s * 100) + '%';
  const near = m.filter(x => x.s >= m[0].s - 0.06 && x.f >= 0.45);
  let html = `<div class="card"><img class="shot" alt="" src="${shot.url}">
    <details><summary class="muted">Распознанный текст (можно исправить)</summary>
    <textarea class="ocr" id="ocrText">${esc(shot.text)}</textarea><div class="row"><button id="reFind">Искать снова</button></div></details></div>`;
  const ai = `<div class="row"><button class="primary" id="askAi">Спросить ИИ (Claude)</button><span class="spacer"></span><button id="aiKey">Ключ ИИ</button></div><div id="aiOut"></div>`;
  if (shot.text && best >= 0.72) {
    html += `<div class="hit good">✓ Найдено в базе · совпадение ${pct(best)}</div>` + answerCard(m[0].q, 'из базы');
    if (near.length > 1) html += `<p class="muted">Похожие вопросы — если картинка другая, сверьте:</p>` + near.slice(1).map(x => answerCard(x.q, 'похож · ' + pct(x.f))).join('');
    html += ai;
  } else if (shot.text && best >= 0.45) {
    // the AI's answer comes first; the look-alikes from the base follow for comparison
    html += `<div class="hit maybe">≈ Точного совпадения в базе нет</div>` + ai +
      `<p class="muted">Похожие вопросы из базы — сверьте с вашим скриншотом:</p>` + m.slice(0, 3).map(x => answerCard(x.q, 'похож · ' + pct(x.f))).join('');
  } else {
    html += `<div class="hit none">✗ В базе такого вопроса нет</div>` + ai;
  }
  $('#shotOut').innerHTML = html;
  $('#reFind').onclick = () => { shot.text = $('#ocrText').value; showShot(); };
  $('#askAi').onclick = askAi;
  $('#aiKey').onclick = () => aiKeyForm(false);
  if (!(shot.text && best >= 0.72) && store.get('cb_api_key', '')) askAi();
}
function aiKeyForm(thenAsk){
  $('#aiOut').innerHTML = `<div class="card"><b>Ключ Claude API</b>
    <p class="muted">Нужен только для вопросов, которых нет в базе. Хранится лишь на этом устройстве. Создать: console.anthropic.com → API Keys; там же поставьте месячный лимит расходов. Один вопрос стоит примерно 5 центов.</p>
    <p class="muted">Без ключа: отправьте этот же скриншот в ваш проект Claude «Права Clase B» — там ответ по подписке, с той же базой.</p>
    <input class="key" id="keyIn" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(store.get('cb_api_key', ''))}">
    <div class="row"><button class="primary" id="keySave">Сохранить</button><button id="keyDel">Удалить ключ</button></div></div>`;
  $('#keySave').onclick = () => { store.set('cb_api_key', $('#keyIn').value.trim()); if (thenAsk && store.get('cb_api_key', '')) askAi(); else $('#aiOut').innerHTML = '<p class="muted">Ключ сохранён.</p>'; };
  $('#keyDel').onclick = () => { store.set('cb_api_key', ''); $('#aiOut').innerHTML = '<p class="muted">Ключ удалён с устройства.</p>'; };
}
const AI_MODEL = 'claude-opus-5-5';
const AI_SYSTEM = `You help a Russian-speaking student prepare for the Chilean Clase B driver's licence theory exam (CONASET; Ley de Tránsito N° 18.290 and the official "Libro del Nuevo Conductor"). You get a screenshot of one practice question in Spanish, its OCR text, and the closest questions from the student's database, whose marked answers are verified against the official practice site.
Read the question and every answer option from the image exactly as written; the OCR text can contain errors, the image is authoritative. If a database question is the same question (same meaning and the same options, even if the picture or the order of options differs), set matched_id to its id and mark as correct the options that correspond to its ✓ answers. Otherwise answer from Chilean traffic law and the official manual and set matched_id to an empty string. Some questions have more than one correct option.
List the options in the order of the screenshot, with the letters shown there (A, B, C... if none). question_ru, text_ru and explanation_ru are in Russian; the explanation is 1-3 short sentences naming the rule. confidence is high when matched or certain from the law, otherwise medium or low.`;
const AI_SCHEMA = {type: 'object', additionalProperties: false,
  required: ['question_es', 'question_ru', 'options', 'matched_id', 'explanation_ru', 'confidence'],
  properties: {question_es: {type: 'string'}, question_ru: {type: 'string'},
    options: {type: 'array', items: {type: 'object', additionalProperties: false, required: ['letter', 'text_es', 'text_ru', 'correct'],
      properties: {letter: {type: 'string'}, text_es: {type: 'string'}, text_ru: {type: 'string'}, correct: {type: 'boolean'}}}},
    matched_id: {type: 'string'}, explanation_ru: {type: 'string'}, confidence: {type: 'string', enum: ['high', 'medium', 'low']}}};
function shotJpeg(file){   // base64 JPEG, long side at most 1600 px
  return new Promise((ok, no) => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    ok(c.toDataURL('image/jpeg', 0.9).split(',')[1]); }; im.onerror = no; im.src = shot.url; });
}
let sdk = null;
async function askAi(){
  const key = store.get('cb_api_key', '');
  if (!key) return aiKeyForm(true);
  if (!window.SDK_URL) { $('#aiOut').innerHTML = '<div class="card">ИИ работает в веб-версии приложения.</div>'; return; }
  const out = $('#aiOut'); $('#askAi').disabled = true;
  out.innerHTML = '<div class="card muted">Спрашиваю Claude… обычно 10–40 секунд</div>';
  try {
    sdk = sdk || await import(new URL(window.SDK_URL, location.href).href);
    const client = new sdk.Anthropic({apiKey: key, dangerouslyAllowBrowser: true});
    const ref = findMatches(shot.text).map(({q}) => `[${q.id}] ${q.es}\n` +
      q.opts.map((o, i) => `  ${'ABCD'[i]}) ${o.es}${o.ok ? '  ✓' : ''}`).join('\n')).join('\n\n');
    const msg = await client.beta.messages.parse({
      model: AI_MODEL, max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
      output_config: {effort: 'high', format: sdk.betaJSONSchemaOutputFormat(AI_SCHEMA)},
      system: AI_SYSTEM,
      messages: [{role: 'user', content: [
        {type: 'image', source: {type: 'base64', media_type: 'image/jpeg', data: await shotJpeg(shot.file)}},
        {type: 'text', text: `OCR text of the screenshot:\n${shot.text || '(not recognized)'}\n\nClosest questions in the database:\n\n${ref}`}]}]
    });
    if (msg.stop_reason === 'refusal') throw new Error('модель отказалась отвечать на этот запрос');
    const r = msg.parsed_output;
    if (!r) throw new Error('не удалось разобрать ответ модели');
    const db = r.matched_id && ALL.find(q => q.id === r.matched_id);
    out.innerHTML = `<div class="hit ${r.confidence === 'high' ? 'good' : 'maybe'}">Ответ ИИ · уверенность: ${{high: 'высокая', medium: 'средняя', low: 'низкая'}[r.confidence]}${db ? ' · вопрос найден в базе: ' + db.id : ' · вопроса нет в базе'}</div>
      <div class="card"><div class="peekable"><div class="q-es">${esc(r.question_es)}</div><div class="ru">${esc(r.question_ru)}</div></div>
      <div class="opts">${r.options.map(o => `<div class="opt ${o.correct ? 'ok' : ''}"><span class="k">${esc(o.letter)}</span>
        <span class="peekable"><span>${esc(o.text_es)}</span><span class="ru">${esc(o.text_ru)}</span></span>${o.correct ? '<span class="tag">✓ правильный</span>' : ''}</div>`).join('')}</div>
      <p>${esc(r.explanation_ru)}</p></div>${db ? answerCard(db, 'в базе') : ''}`;
  } catch (e) {
    const A = sdk && sdk.Anthropic;
    const why = !A ? 'не загрузилась библиотека ИИ — нужен интернет'
      : e instanceof A.AuthenticationError ? 'ключ не подошёл — проверьте его в «Ключ ИИ»'
      : e instanceof A.PermissionDeniedError ? 'у ключа нет доступа к модели'
      : e instanceof A.RateLimitError ? 'превышен лимит запросов — попробуйте через минуту'
      : e instanceof A.APIConnectionError ? 'нет связи с сервером — проверьте интернет'
      : e instanceof A.APIError ? `ошибка API ${e.status || ''}: ${e.message}` : String(e.message || e);
    out.innerHTML = `<div class="card">ИИ не ответил: ${esc(why)}</div>`;
  } finally { const b = $('#askAi'); if (b) b.disabled = false; }
}

(async () => {
  const ITER = 200000;
  const view = document.getElementById('view');
  const hidden = [document.querySelector('nav'), document.querySelector('.base')];
  hidden.forEach(x => x.style.visibility = 'hidden');
  const get = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
  async function decrypt(buf, pw){
    const salt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv}, key, ct)));
    d.key = key; return d;
  }
  // photos: img/<hash>.bin = iv(12) + AES-GCM(jpeg), same key as data.enc
  function photos(key){
    const urls = new Map();
    window.loadImg = path => {
      if (!urls.has(path)) urls.set(path, fetch(path).then(r => { if (!r.ok) throw r.status; return r.arrayBuffer(); })
        .then(b => crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12)))
        .then(p => URL.createObjectURL(new Blob([p], {type: 'image/jpeg'})))
        .catch(e => { urls.delete(path); throw e; }));
      return urls.get(path);
    };
  }
  // keep every photo available offline: fetch them quietly in the background (the service worker caches them)
  function prefetch(paths){
    if (!navigator.onLine) return;
    let i = 0;
    const next = () => { if (i < paths.length) fetch(paths[i++]).catch(() => {}).finally(next); };
    setTimeout(() => { for (let k = 0; k < 4; k++) next(); }, 3000);
  }
  view.innerHTML = '<div class="card muted">Загрузка…</div>';
  let buf;
  try { buf = new Uint8Array(await (await fetch('data.enc?v=812fe4d83a')).arrayBuffer()); }
  catch(e) { view.innerHTML = '<div class="card">Нет данных. Откройте приложение один раз с интернетом.</div>'; return; }
  window.OCR_BASE = 'ocr-5.1.1/'; window.SDK_URL = 'vendor/anthropic-sdk-1.3.0.js';
  const run = d => { photos(d.key); hidden.forEach(x => x.style.visibility = ''); startApp(d.q, d.img, d.ch);
    prefetch([...new Set(Object.values(d.img))]); };
  const saved = get('cb_pw');
  if (saved) { try { return run(await decrypt(buf, saved)); } catch(e) {} }
  view.innerHTML = `<form class="card" id="lock">
      <p style="margin-top:0"><b>Введите пароль</b></p>
      <input type="password" id="pw" autocomplete="current-password" style="font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
      <p class="muted" id="msg" style="min-height:1.4em"></p>
      <button class="primary" type="submit">Открыть</button></form>`;
  const pw = document.getElementById('pw'); pw.focus();
  document.getElementById('lock').onsubmit = async e => {
    e.preventDefault();
    document.getElementById('msg').textContent = 'Проверяю…';
    try { const d = await decrypt(buf, pw.value); put('cb_pw', pw.value); run(d); }
    catch(err) { document.getElementById('msg').textContent = 'Неверный пароль'; pw.select(); }
  };
})();
